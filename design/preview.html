    });
    syncToggle(ctl.unfold, state.unfolded, false);
    syncToggle(ctl.rays, state.rays, state.unfolded || !hasLines);
    syncToggle(ctl.hidden, state.hiddenLines, !hasLines);
    syncToggle(ctl.parts, state.partsOpen, false);
    syncToggle(ctl.sheet, state.sheetOpen, false);
    // sheet toolbar: guides exist only on the sheet; available in every state except compute-error
    syncToggle(ctl.align, state.align, failed);

    // sheet + planes: focus highlight, dimming, labels
    VIEWS.forEach(function (v) {
      var focused = !failed && state.focus === v, dim = !failed && state.focus !== 'all' && state.focus !== v;
      var sheetView = $('#sheet-view-' + v), plane = $('#vol-plane-' + v);
      sheetView.classList.toggle('is-focus', focused);
      sheetView.classList.toggle('is-dim', dim);
      sheetView.setAttribute('aria-pressed', String(focused));
      sheetView.querySelector('.view-label').innerHTML = labelMarkup(v, focused, false);
      plane.classList.toggle('is-focus', focused);
      plane.classList.toggle('is-dim', dim);
      plane.querySelector('.view-label').innerHTML = labelMarkup(v, focused, true);
    });
    $('#sheet-svg').classList.toggle('focus-locked', !focusAllowed());
    $('#sheet-drawing').style.display = status === 'ok' ? '' : 'none';
    $('#sheet-loading').hidden = status !== 'loading';
    $('#sheet-error').hidden = !failed;
    // title block follows the selected part at once; the scale waits for its views
    $('#tb-name').textContent = part.name;
    $('#tb-name-en').textContent = part.en;
    $('#tb-no').textContent = 'TV-' + part.no;
    $('#tb-scale').textContent = status === 'ok' && state.result.views && part.scale ? part.scale : '—';
    applyCamera();
  }

  /* ---------- wiring: SpatialUI public events ---------- */
  $('#part-list').addEventListener('select', function (e) {
    var id = e.detail && e.detail.value; if (id) selectPart(id);
  });
  ctl.focus.addEventListener('select', function (e) { setFocus(FOCUS.indexOf(e.detail.value) >= 0 ? e.detail.value : 'all'); });
  ctl.unfold.addEventListener('checked-change', function (e) { setUnfolded(!!e.detail.checked); });
  ctl.rays.addEventListener('checked-change', function (e) { state.rays = !!e.detail.checked; renderState(); });
  ctl.hidden.addEventListener('checked-change', function (e) { state.hiddenLines = !!e.detail.checked; renderState(); });
  ctl.align.addEventListener('checked-change', function (e) { state.align = !!e.detail.checked; renderState(); });
  ctl.reset.addEventListener('click-action', resetView);
  ctl.parts.addEventListener('checked-change', function (e) { setPartsOpen(!!e.detail.checked); });
  ctl.sheet.addEventListener('checked-change', function (e) { setSheetOpen(!!e.detail.checked); });
  $('#parts-close').addEventListener('click-action', function () { setPartsOpen(false); });   // system close button of the Parts window
  $('#sheet-close').addEventListener('click-action', function () { setSheetOpen(false); });   // system close button of the Sheet window
  $('#compute-retry').addEventListener('click-action', retryCompute);

  /* ---------- wiring: domain surfaces (drawing sheet, 3D box) ---------- */
  $('#sheet-svg').addEventListener('click', function (e) {
    var g = e.target.closest && e.target.closest('.sheet-view'); if (g) setFocus(g.dataset.view);
  });
  $('#sheet-svg').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var g = e.target.closest && e.target.closest('.sheet-view'); if (g) { e.preventDefault(); setFocus(g.dataset.view); }
  });
  (function () {
    var vp = $('#vol-viewport'), drag = null;
    function end(e, click) {
      if (!drag) return;
      var d = drag; drag = null;
      // normalise without animating, then release
      state.yaw = ((state.yaw + 180) % 360 + 360) % 360 - 180; applyCamera();
      requestAnimationFrame(function () { box.classList.remove('dragging'); });
      if (click && !d.moved) {
        var plane = d.target.closest && d.target.closest('.plane');
        if (plane) setFocus(plane.dataset.view);           // tapping a plane = focusing that view
      }
    }
    vp.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      drag = { x: e.clientX, yaw: state.yaw, moved: false, target: e.target };
      try { vp.setPointerCapture(e.pointerId); } catch (_) {}
    });
    vp.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = e.clientX - drag.x;
      if (!drag.moved && Math.abs(dx) > 4) { drag.moved = true; box.classList.add('dragging'); }
      if (drag.moved) { state.yaw = drag.yaw + dx * 0.45; applyCamera(); }   // horizontal drag = rotation about the vertical axis
    });
    vp.addEventListener('pointerup', function (e) { end(e, true); });
    vp.addEventListener('pointercancel', function (e) { end(e, false); });
  })();

  /* ---------- sheet text floor: drawing units per CSS px ---------- */
  (function () {
    var svg = $('#sheet-svg');
    function update() {
      var r = svg.getBoundingClientRect(), k = Math.min(r.width / 372, r.height / 300);
      if (k > 0) svg.style.setProperty('--upx', (1 / k).toFixed(4));
    }
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(update).observe(svg);
    window.addEventListener('resize', update);
    update();
  })();

  /* ---------- review hooks (script only; no visible control) ---------- */
  window.threeViewsPreview = {
    state: function () {
      return { name: derivedState(), partId: state.partId, focus: state.focus, unfolded: state.unfolded, rays: state.rays, hiddenLines: state.hiddenLines, align: state.align,
        partsOpen: state.partsOpen, sheetOpen: state.sheetOpen, compute: state.result.status, shownPartId: state.shown.partId, hasLines: !!(state.shown.status === 'ok' && state.shown.views),
        yaw: state.yaw, fold: box.dataset.fold, pictorial: pictorial(partById(state.shown.partId)) };
    },
    parts: function () { return PARTS.map(function (p) { return { id: p.id, name: p.name, en: p.en, consistent: verifyPart(p) }; }); },
    select: selectPart,
    failNextCompute: function () { session.failNext = true; },                                  // error sample for any part
    setLineData: function (mode) { session.lineData = mode === 'missing' ? 'missing' : 'normal'; requestCompute(); },   // fallback sample
    setComputeDelay: function (ms) { session.delay = Math.max(0, +ms || 0); }                   // how long the loading text shows
  };

  /* ---------- boot ---------- */
  buildSheet();
  buildPlanes();
  buildLibrary();
  PARTS.forEach(function (p) { if (!verifyPart(p)) console.error('三等关系不一致 views disagree: ' + p.name); });
  state.result = { status: 'loading', views: null };
  finishCompute(currentPart());      // the first drawing is ready before the first paint
})();
</script>
</body>
</html>
